<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2b4e"/>
      <stop offset="1" stop-color="#0a1f38"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid, echoes the hero plan-card -->
  <g stroke="#3d6ea8" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="350" y1="0" x2="350" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="950" y1="0" x2="950" y2="630"/><line x1="1150" y1="0" x2="1150" y2="630"/>
  </g>

  <!-- brand mark -->
  <rect x="90" y="88" width="56" height="56" rx="14" fill="#1a4d8f"/>
  <text x="118" y="128" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  <text x="164" y="126" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Read My<tspan fill="#9db6d6" font-weight="500">Blueprint</tspan></text>

  <!-- headline -->
  <text x="90" y="255" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Upload a plan.</text>
  <text x="90" y="325" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Get counts you</text>
  <text x="90" y="395" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="700" fill="#f0895a">can actually trust.</text>

  <text x="90" y="450" font-family="Inter, Arial, sans-serif" font-size="24" fill="#c7d5e8">Metal studs, drywall, wood framing, plywood, insulation —</text>
  <text x="90" y="484" font-family="Inter, Arial, sans-serif" font-size="24" fill="#c7d5e8">every number backed by real geometry, or flagged to confirm.</text>

  <!-- stat chips -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="90" y="524" width="150" height="56" rx="10" fill="#141d2c" stroke="#2a3547"/>
    <text x="110" y="552" font-size="20" font-weight="700" fill="#f0895a">98%</text>
    <text x="110" y="570" font-size="12" fill="#9aa5b4">real coverage</text>

    <rect x="256" y="524" width="180" height="56" rx="10" fill="#141d2c" stroke="#2a3547"/>
    <text x="276" y="552" font-size="20" font-weight="700" fill="#f0895a">1.2M+</text>
    <text x="276" y="570" font-size="12" fill="#9aa5b4">CMU blocks counted</text>

    <rect x="452" y="524" width="180" height="56" rx="10" fill="#141d2c" stroke="#2a3547"/>
    <text x="472" y="552" font-size="20" font-weight="700" fill="#f0895a">0</text>
    <text x="472" y="570" font-size="12" fill="#9aa5b4">silent guesses — ever</text>
  </g>
</svg>
