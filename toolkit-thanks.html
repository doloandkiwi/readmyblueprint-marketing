<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Toolkit Sent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Your bid-prep toolkit is on its way — and available to download right here too.">
<link rel="canonical" href="https://www.readmyblueprint.com/toolkit-thanks.html">
<meta name="theme-color" content="#0d2b4e">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0f1b2d; --paper:#f6f3ea; --surface:#ffffff; --surface-2:#eeeadb;
  --muted:#5c6470; --line:#dcd5c2; --blue:#1a4d8f; --blue-deep:#0d2b4e;
  --blue-soft:#e7eef7; --accent:#ad4c1f;--btn-accent:#ad4c1f; --accent-soft:#fbe7da;
  --good:#2f7a4d; --good-soft:#e7f2ea;
  --shadow: 0 1px 2px rgba(15,27,45,0.06), 0 12px 32px -16px rgba(15,27,45,0.25);
  --display:'Space Grotesk',sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef1f5; --paper:#0d1420; --surface:#141d2c; --surface-2:#1b2536;
    --muted:#9aa5b4; --line:#2a3547; --blue:#6ea3e0; --blue-deep:#dbe8f8;
    --blue-soft:#1c2b40; --accent:#f0895a;--btn-accent:#bb4611; --accent-soft:#3a2416;
    --good:#6fbf7c; --good-soft:#173222;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --ink:#eef1f5; --paper:#0d1420; --surface:#141d2c; --surface-2:#1b2536;
  --muted:#9aa5b4; --line:#2a3547; --blue:#6ea3e0; --blue-deep:#dbe8f8;
  --blue-soft:#1c2b40; --accent:#f0895a;--btn-accent:#bb4611; --accent-soft:#3a2416;
  --good:#6fbf7c; --good-soft:#173222;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;}
h1{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;}
a{color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:80px 24px;text-align:center;}
.badge{width:56px;height:56px;border-radius:99px;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 20px;}
h1{font-size:clamp(1.7rem,3.4vw,2.2rem);margin:0 0 12px;}
p{color:var(--muted);font-size:1.02rem;}
.files{display:flex;flex-direction:column;gap:12px;margin:28px 0;text-align:left;}
.files a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink);font-weight:600;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.files a:hover{border-color:var(--blue);}
.files a span{font-family:var(--mono);font-size:.78rem;color:var(--blue);font-weight:400;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:.7rem 1.3rem;font-size:.95rem;font-weight:600;text-decoration:none;background:var(--btn-accent);color:#fff;margin-top:12px;}
</style>

<div class="wrap">
  <div class="badge">✓</div>
  <h1>It's on its way to your inbox.</h1>
  <p>You can also grab both files directly, right now, below.</p>
  <div class="files">
    <a href="/assets/toolkit/bid-sheet-template.csv">Bid sheet template (CSV) <span>.csv</span></a>
    <a href="/assets/toolkit/pre-bid-checklist.txt">Pre-bid review checklist <span>.txt</span></a>
  </div>
  <a href="https://app.readmyblueprint.com" class="btn">Try your first plan set — $15</a>
</div>
</html>
